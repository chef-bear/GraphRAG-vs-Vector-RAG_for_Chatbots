[project]
name = "agentic-fraud-bench"
version = "0.1.0"
description = "Agentic fraud investigation across relational (PostgreSQL) and graph (Neo4j) databases"
requires-python = ">=3.11"
dependencies = [
    "pandas>=2.2",
    "pyarrow>=15",
    "psycopg[binary]>=3.1",
    "neo4j>=5.20",
    "pyyaml>=6",
    "pydantic>=2.6",
    "networkx>=3.2",
    "python-dotenv>=1.0",
]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.5"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["core*", "ingest*", "agent*", "bench*", "analysis*"]

[tool.setuptools.package-data]
ingest = ["sql/*.sql"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
markers = [
    "integration: needs running Postgres/Neo4j (opt-in via `make test-integration`)",
    "data: needs the real AMLSim CSVs in data/raw/ (skipped when absent)",
]
addopts = "-m 'not integration'"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]
